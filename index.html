<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>ダイコーゴム様 研修用プロンプト集</title><style>
/* 研修テキストの続きとして読む一列のノート。朱は番号とボタンだけ */
:root{
  --bg:#fbfbfa; --paper:#ffffff; --fg:#1f1f1f; --sub:#5f5b58; --line:#d9d5d2; --acc:#b8431e; --acc-ink:#ffffff; --code:#f4f2f0;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif; --f-mono:"BIZ UDGothic","Hiragino Sans","Yu Gothic",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161514;--paper:#1f1e1c;--fg:#ecebe9;--sub:#a9a4a0;--line:#3a3734;--acc:#e0714a;--acc-ink:#1a0f0a;--code:#262422;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161514;--paper:#1f1e1c;--fg:#ecebe9;--sub:#a9a4a0;--line:#3a3734;--acc:#e0714a;--acc-ink:#1a0f0a;--code:#262422;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header h1{font-size:1.45rem;line-height:1.35;margin:4px 0 6px;text-wrap:balance}
header p{margin:0;color:var(--sub);font-size:.92rem}
.kicker{color:var(--acc);font-weight:700;font-size:.8rem;letter-spacing:.06em}
.howto{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:14px 16px;font-size:.92rem}
.howto ol{margin:6px 0 0;padding-left:1.3em}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump a{min-width:2.4em;text-align:center;padding:4px 0;border:1px solid var(--line);border-radius:6px;color:var(--fg);text-decoration:none;font-variant-numeric:tabular-nums;background:var(--paper)}
section{display:flex;flex-direction:column;gap:14px}
h2{font-size:1.15rem;margin:8px 0 0;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--line);padding-bottom:8px}
.eyebrow{font-size:.78rem;color:var(--acc);letter-spacing:.06em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;scroll-margin-top:12px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.no{font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.tool{font-size:.85rem;color:var(--sub);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
h3{margin:0;font-size:1.02rem;line-height:1.45}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:.86rem;line-height:1.65;background:var(--code);border-radius:8px;padding:12px;user-select:all;-webkit-user-select:all}
.copy{align-self:stretch;appearance:none;border:0;border-radius:8px;background:var(--acc);color:var(--acc-ink);font:700 1rem var(--f-body);padding:12px;cursor:pointer}
.copy.done{background:var(--fg);color:var(--bg)}
.copy:focus-visible,.jump a:focus-visible,.tool:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tbl{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.84rem;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-weight:700;border-bottom:1.5px solid var(--fg)}
.note{margin:0;color:var(--sub);font-size:.78rem}
footer{color:var(--sub);font-size:.8rem;border-top:1px solid var(--line);padding-top:12px}
.demo{font-size:.78rem;color:var(--sub);border:1px dashed var(--line);border-radius:999px;padding:1px 9px}
.file{font-size:.85rem;color:var(--sub)}
.file a{color:var(--acc)}
.dl{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.dl a{display:block;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);color:var(--fg);text-decoration:none}
.dl a span{display:block;font-size:.8rem;color:var(--sub)}
details{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:10px 14px}
details summary{cursor:pointer;font-weight:700}
details[open]{display:flex;flex-direction:column;gap:8px}
details pre{max-height:320px;overflow:auto}
*{box-sizing:border-box}

.files-note{margin:0;color:var(--sub);font-size:.85rem}
@media print{.copy,.jump,.tool{display:none}pre{user-select:text}}
</style></head>
<body><div class="wrap"><header><div class="kicker">生成AI業務活用研修</div><h1>ダイコーゴム様 研修用プロンプト集</h1>

<footer>© 2026 がだんだん株式会社</footer></div></body></html>
